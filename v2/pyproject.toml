[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housisense"
version = "2.0.0"
description = "Spatial-cognitive retrieval over urban geospatial data and guest reviews"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "scipy>=1.10",
    "h3>=4.0",
    "matplotlib>=3.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.14",
    "requests>=2.31",
]

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.38", "sentence-transformers>=2.5"]
app = ["streamlit>=1.32", "folium>=0.15", "streamlit-folium>=0.18"]
stats = ["statsmodels>=0.14"]
basemap = ["contextily>=1.5"]

[tool.setuptools.packages.find]
include = ["housisense*"]
